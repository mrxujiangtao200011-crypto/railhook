groups:
  - name: railhook.retry_backlog
    rules:
      - alert: DeliveryPendingBacklogGrowing
        expr: |
          delta(delivery_queue_depth{status="pending"}[15m]) > 500
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Delivery pending backlog growing rapidly"
          description: |
            Pending deliveries increased by {{ $value | printf "%.0f" }} in 15 min.
            Check downstream endpoint health and worker scaling.

      - alert: DeliveryPendingBacklogHigh
        expr: |
          delivery_queue_depth{status="pending"} > 5000
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Delivery pending backlog above 5000"
          description: |
            {{ $value | printf "%.0f" }} deliveries pending for >10 min.
            Consider scaling workers or investigating failing endpoints.

      - alert: DeliveryPendingBacklogCritical
        expr: |
          delivery_queue_depth{status="pending"} > 20000
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "CRITICAL: Delivery pending backlog above 20000"
          description: |
            {{ $value | printf "%.0f" }} deliveries pending.
            Hard-cap auto-DLQ escalation may trigger. Immediate investigation required.

      - alert: IncomingForwardPendingBacklogHigh
        expr: |
          incoming_forward_queue_depth{status="pending"} > 3000
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Incoming forward pending backlog above 3000"
          description: |
            {{ $value | printf "%.0f" }} incoming forwards pending for >10 min.

  - name: railhook.dlq
    rules:
      - alert: DlqDepthGrowing
        expr: |
          delta(delivery_queue_depth{status="dlq"}[1h]) > 100
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "DLQ growing: {{ $value | printf \"%.0f\" }} new entries in 1h"
          description: |
            DLQ entries increasing. Check endpoint availability and delivery logs.

      - alert: DlqRateHigh
        expr: |
          sum(rate(webhook_delivery_attempts_total{result=~"error|failure"}[1h])) / sum(rate(webhook_delivery_attempts_total[1h]))
          > 0.1
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Delivery failure rate above 10% for >10 min"
          description: |
            {{ $value | humanizePercentage }} failure rate. SLO target: <5% DLQ rate.

      - alert: IncomingForwardFailureRateHigh
        expr: |
          sum(rate(incoming_forward_attempts_total{result=~"error|failure"}[1h])) / sum(rate(incoming_forward_attempts_total[1h]))
          > 0.1
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Incoming forward failure rate above 10% for >10 min"
          description: |
            {{ $value | humanizePercentage }} failure rate. SLO target: <5% DLQ rate.

      - alert: DlqActionableBacklog
        expr: |
          webhook_dlq_depth > 0
        for: 30m
        labels:
          severity: info
          component: worker
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} deliveries in DLQ status"
          description: |
            Deliveries awaiting manual retry or purge via DlqService.

      - alert: IncomingForwardDlqActionableBacklog
        expr: |
          incoming_forward_dlq_depth > 0
        for: 30m
        labels:
          severity: info
          component: worker
        annotations:
          summary: "{{ $value | printf \"%.0f\" }} forwards in DLQ status"
          description: |
            Forwards awaiting manual retry or purge.

  - name: railhook.circuit_breaker
    rules:
      - alert: CircuitBreakerTripsHigh
        expr: |
          rate(circuit_breaker_state_transitions_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Circuit breakers tripping frequently"
          description: |
            {{ $value | printf "%.1f" }} circuit breaker transitions/sec.
            Multiple endpoints may be failing. Check endpoint health dashboard.

      - alert: CircuitBreakerRejectionsHigh
        expr: |
          rate(circuit_breaker_rejected_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Circuit breaker rejecting >10 calls/sec"
          description: |
            Many deliveries being skipped due to open circuit breakers.

      - alert: CircuitBreakerDegraded
        expr: |
          rate(circuit_breaker_degraded_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Circuit breaker cannot reach Redis"
          description: |
            {{ $value | printf "%.2f" }} circuit breaker operations/sec are failing open
            because Redis is unreachable. Deliveries continue — that is deliberate — but
            outcomes are not being counted, so no breaker will trip however badly an
            endpoint behaves. An endpoint that looks healthy right now may only look that
            way because nothing is measuring it. Check Redis before trusting the breaker
            dashboards.

  - name: railhook.api
    rules:
      # Tunnels are excluded: they relay the customer's own machine. The five-error floor keeps a
      # quiet deployment's two or three from paging.
      - alert: ApiErrorRateHigh
        expr: |
          (sum(rate(http_server_requests_seconds_count{status=~"5..", uri!~"/tunnel/.*"}[5m])) or vector(0)) /
          sum(rate(http_server_requests_seconds_count{uri!~"/tunnel/.*"}[5m]))
          > 0.005
          and sum(increase(http_server_requests_seconds_count{status=~"5..", uri!~"/tunnel/.*"}[5m])) >= 5
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API 5xx error rate above 0.5%"
          description: |
            {{ $value | humanizePercentage }} of requests returning 5xx.
            SLO target: <0.1% over 30d. Investigate API logs immediately.

  - name: railhook.staleness
    rules:
      - alert: OldestPendingDeliveryStale
        expr: |
          delivery_oldest_pending_age_seconds > 3600
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Oldest pending delivery is {{ $value | printf \"%.0f\" }}s old"
          description: |
            A delivery has been pending for over 1 hour.
            Check the worker is running and claiming, and whether the endpoint is failing.

      - alert: OldestPendingDeliveryCritical
        expr: |
          delivery_oldest_pending_age_seconds > 86400
        for: 5m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "CRITICAL: Pending delivery stuck for >24h"
          description: |
            A delivery has been in PENDING state for {{ $value | printf "%.0f" }}s.
            Hard-cap escalation should have moved this to DLQ. Investigate immediately.

      - alert: OldestPendingForwardStale
        expr: |
          forward_oldest_pending_age_seconds > 3600
        for: 5m
        labels:
          severity: warning
          component: worker
        annotations:
          summary: "Oldest pending forward is {{ $value | printf \"%.0f\" }}s old"
          description: |
            An incoming forward has been pending for over 1 hour.
            Check the worker is running and claiming, and whether the destination is failing.

  - name: railhook.infrastructure
    rules:
      - alert: ApiDown
        expr: |
          up{job="railhook-api"} == 0
        for: 2m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "The api is not being scraped"
          description: |
            Prometheus cannot reach the api's management port. Either the process is down,
            or it is up and unreachable — both mean no event can be accepted right now.

      - alert: WorkerDown
        expr: |
          up{job="railhook-worker"} == 0
        for: 2m
        labels:
          severity: critical
          component: worker
        annotations:
          summary: "The worker is not being scraped"
          description: |
            Prometheus cannot reach the worker's management port. Nothing is delivering
            webhooks. Queue-depth alerts will follow in several minutes; this one is the
            direct signal.
